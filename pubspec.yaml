name: alaska_atlas
description: "Alaska Atlas — your rugged guide to the Last Frontier. Hot spots, field guides, recommendations, and gear rentals by Turnagain Outfitters."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  go_router: ^15.1.2
  flutter_map: ^8.1.1
  latlong2: ^0.9.1
  google_fonts: ^6.2.1
  url_launcher: ^6.3.1
  http: ^1.4.0
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/bathymetry/
    - assets/highways/
