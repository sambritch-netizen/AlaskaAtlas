name: Deploy Web Preview

on:
  workflow_dispatch:
  push:
    branches: [claude/alaska-atlas-app-r9rg32, claude/optimistic-hamilton-j51yk0]

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.32.5
          cache: true
      - run: flutter pub get
      - run: flutter test
      - run: flutter build web --release --no-web-resources-cdn --base-href /AlaskaAtlas/
      - run: touch build/web/.nojekyll
      # Publishing to the gh-pages branch auto-deploys via GitHub Pages;
      # the Pages REST API (configure-pages) is not permitted for this repo's
      # workflow token, so branch-based deployment is used instead.
      - uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: build/web
          publish_branch: gh-pages
          force_orphan: true
